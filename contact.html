<body class="page-sub">
  <header class="site-header">
    <a class="logo" href="index.html" aria-label="WISEBIRDS AI STUDIO 메인으로">
      <span class="logo-light">WISEBIRDS</span> <span class="logo-strong">AI STUDIO</span>
    </a>
    <nav class="gnb" aria-label="주요 메뉴">
      <a href="makeup.html" data-nav="makeup">MAKE<b>UP</b></a>
      <a href="index.html#model" data-nav="model">MODEL</a>
      <a href="contact.html" data-nav="contact" class="is-active">CONTACT</a>
    </nav>
  </header>

  <main class="contact">
    <h1 class="contact-title">AI STUDIO</h1>

    <form id="contactForm" class="contact-form" novalidate>
      <div class="field">
        <label for="cName">YOUR NAME</label>
        <input id="cName" name="name" type="text" maxlength="100" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="cEmail">EMAIL</label>
        <input id="cEmail" name="email" type="email" maxlength="200" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="cPhone">PHONE</label>
        <input id="cPhone" name="phone" type="tel" maxlength="50" autocomplete="tel" inputmode="tel">
      </div>
      <div class="field field-message">
        <label for="cMessage">YOUR MESSAGE</label>
        <textarea id="cMessage" name="message" rows="6" maxlength="5000" required></textarea>
      </div>

      <!-- 스팸 방지용 숨김 칸 (사람에게는 보이지 않음) -->
      <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">

      <label class="agree">
        <input type="checkbox" name="agree" required>
        <span>문의 응대를 위해 이름, 이메일, 전화번호를 수집하며 1년간 보관 후 파기합니다. 이에 동의합니다.</span>
      </label>

      <button type="submit" class="send-btn">SEND</button>
      <p class="form-status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/contact.js"></script>
</body>
</html>
